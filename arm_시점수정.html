  집합건물.html의 [지수 자동계산]·[자본수익률 자동계산] 로직을 그대로 옮긴 독립 도구.

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시점수정 — 온결</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: light;
    --bg:#f2f3f5;
    --surface:#ffffff;
    --ink:#1b2330;
    --ink-2:#3d4655;
    --muted:#626b78;
    --faint:#9aa2ae;
    --line:#e4e7ec;
    --line-strong:#d3d8df;
    --bar:#182231;
    --accent:#2c5a8c;
    --accent-strong:#234c7a;
    --accent-ink:#22497a;
    --danger:#b42318;
    --danger-bg:#fdf2f1;
    --danger-line:#f1c9c4;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }

  /* ── App bar ─────────────────────────────────────────── */
  .appbar{position:sticky; top:0; z-index:20; background:var(--bar); border-bottom:1px solid #2a3242;}
  .appbar-inner{max-width:1060px; margin:0 auto; height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 20px;}
  .appbar-left{display:flex; align-items:center; gap:14px; min-width:0;}
  .appbar-title{font-size:14px; font-weight:600; color:#e6e9ef; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appbar-brand{font-size:12px; color:#7c8494; letter-spacing:.02em; flex:none;}

  /* ── Page ────────────────────────────────────────────── */
  .page{max-width:1060px; margin:0 auto; padding:0 20px 48px;}
  .page-head{margin:26px 0 18px;}
  .page-head h1{font-size:21px; font-weight:700; color:var(--ink); letter-spacing:-.01em; text-wrap:balance;}
  .lede{margin-top:7px; font-size:13.5px; color:var(--muted); line-height:1.6; max-width:62ch;}

  /* ── Workspace: input | result ───────────────────────── */
  .workspace{display:grid; grid-template-columns:minmax(0,400px) 1fr; background:var(--surface); border:1px solid var(--line); border-radius:5px; overflow:hidden;}
  .panel{padding:22px 24px;}
  .panel-input{border-right:1px solid var(--line);}
  .panel-head{font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--faint); padding-bottom:11px; border-bottom:1px solid var(--line); margin-bottom:18px;}

  /* segmented control */
  .segmented{display:inline-flex; padding:3px; background:#eceef2; border:1px solid #e0e3e9; border-radius:5px; gap:2px;}
  .seg{appearance:none; border:1px solid transparent; background:transparent; padding:6px 17px; font:inherit; font-size:13px; font-weight:600; color:var(--muted); border-radius:3px; cursor:pointer; line-height:1.2; transition:color .12s, background .12s, border-color .12s;}
  .seg:hover{color:var(--ink-2);}
  .seg.on{background:var(--surface); border-color:#d9dde4; color:var(--ink);}
  .segmented-sub{margin-left:10px;}
  .segmented-sub.off{display:none;}
  .seg-note{margin-top:10px; font-size:12px; color:var(--muted);}

  /* fields */
  .fields{margin-top:20px;}
  .field-pair{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field-pair + .field-pair{margin-top:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; letter-spacing:.005em;}
  select, input[type=text]{width:100%; height:40px; padding:0 11px; font:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:4px; transition:border-color .12s, box-shadow .12s;}
  select{cursor:pointer;}
  input::placeholder{color:#b3b9c2;}
  input:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(44,90,140,.13);}
  .field-hint{margin-top:11px; font-size:11.5px; color:var(--faint); line-height:1.5;}

  /* action */
  .actions{display:flex; justify-content:flex-end; margin-top:22px;}
  .btn-primary{height:40px; padding:0 22px; font:inherit; font-size:14px; font-weight:600; color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:4px; cursor:pointer; transition:background .12s, border-color .12s;}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-primary:disabled{background:var(--line-strong); border-color:var(--line-strong); cursor:default;}

  /* error */
  .status{display:none; margin-top:12px; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .err{display:none; margin-top:16px; padding:10px 12px; font-size:12.5px; font-weight:500; color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger-line); border-left:3px solid var(--danger); border-radius:4px; line-height:1.5;}

  /* ── Result pane ─────────────────────────────────────── */
  #out{display:none;}
  .figure{padding-bottom:17px; border-bottom:1px solid var(--line);}
  .figure-label{font-size:12px; font-weight:600; color:var(--muted);}
  .figure-num{font-size:34px; font-weight:700; color:var(--accent-ink); letter-spacing:.005em; font-variant-numeric:tabular-nums; line-height:1.1; margin-top:7px;}
  .figure-cap{font-size:11.5px; color:var(--faint); margin-top:5px;}

  .formula{margin-top:17px;}
  .formula-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;}
  .formula-label{font-size:12px; font-weight:600; color:var(--muted);}
  .formula-text{width:100%; min-height:170px; padding:12px 13px; font:inherit; font-size:13px; line-height:1.75; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:4px; resize:vertical; font-variant-numeric:tabular-nums; white-space:pre-wrap; word-break:break-word;}
  .formula-text:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(44,90,140,.13);}

  .btn-ghost{height:30px; padding:0 13px; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-2); background:var(--surface); border:1px solid var(--line-strong); border-radius:4px; cursor:pointer; transition:background .12s, border-color .12s, color .12s;}
  .btn-ghost:hover{background:var(--bg); border-color:#c4c9d1;}

  .empty{display:block; padding:26px 2px 8px; font-size:13px; color:var(--faint); line-height:1.65; max-width:36ch;}

  /* ── Data status row ─────────────────────────────────── */
  .datarow{display:flex; align-items:baseline; gap:12px; margin-top:16px; padding:13px 2px 2px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .datarow-label{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--faint); flex:none;}
  .datarow-meta{font-size:12px; color:var(--muted); line-height:1.65; font-variant-numeric:tabular-nums;}

  /* focus-visible for keyboard */
  .seg:focus-visible, .btn-primary:focus-visible, .btn-ghost:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ── Responsive ──────────────────────────────────────── */
  @media (max-width:840px){
    .workspace{grid-template-columns:1fr;}
    .panel-input{border-right:0; border-bottom:1px solid var(--line);}
  }
  @media (max-width:560px){
    .appbar-brand{display:none;}
  }
  @media (max-width:400px){
    .field-pair{grid-template-columns:1fr;}
    .segmented{display:flex;}
    .segmented-sub{margin-left:0; margin-top:6px;}
    .seg{flex:1; text-align:center;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<script src="arap_name.js"></script><!-- 사용자 이름 최초 1회 입력 (이름 없으면 계산 화면으로 못 넘어감) -->
<header class="appbar">
  <div class="appbar-inner">
    <div class="appbar-left">
      <span class="appbar-title">시점수정</span>
      <span id="arap-name-badge" style="font-size:12px;color:#9aa2ae;white-space:nowrap;"></span>
    </div>
    <span class="appbar-brand">온결 · 감정평가 자동화</span>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h1>시점수정 계산</h1>
    <p class="lede">한국부동산원 매매가격지수·자본수익률·지가변동률을 기준으로 거래시점에서 기준시점까지의 시점수정치를 산정합니다.</p>
  </div>

  <section class="workspace">
    <!-- 입력 -->
    <div class="panel panel-input">
      <div class="panel-head">입력</div>

      <div class="segmented" role="group" aria-label="물건 구분">
        <button id="tab-bld" class="seg on" type="button">집합건물</button>
        <button id="tab-land" class="seg" type="button">토지</button>
      </div>
      <div class="segmented segmented-sub" id="sub-bld" role="group" aria-label="집합건물 용도 구분">
        <button id="tab-res" class="seg on" type="button">주거용</button>
        <button id="tab-nr" class="seg" type="button">비주거용</button>
      </div>
      <p class="seg-note" id="segNote">산정 기준 · 매매가격지수 (한국부동산원)</p>

      <div class="fields">
        <div class="field-pair">
          <div class="field">
            <label for="kind" id="lbl-kind">유형</label>
            <select id="kind"></select>
          </div>
          <div class="field">
            <label for="region" id="lbl-region">지역</label>

        <div class="field-pair">
          <div class="field">
            <label for="tradeDate">거래시점 (사례)</label>
            <input type="text" id="tradeDate" placeholder="YYYY.MM.DD">
          </div>
          <div class="field">
            <label for="baseDate">기준시점</label>

        <p class="field-hint">날짜 형식 · YYYY.MM.DD</p>
      </div>

      <div class="actions">
        <button class="btn-primary" id="btn-calc" type="button">시점수정치 계산</button>
      </div>

      <div class="status" id="status"></div>
      <div class="err" id="err"></div>
    </div>

    <!-- 결과 -->
    <div class="panel panel-result">
      <div class="panel-head">결과</div>

      <div class="result" id="out">
        <div class="figure">
          <div class="figure-label">시점수정치</div>
          <div class="figure-num" id="adjNum"></div>
          <div class="figure-cap">여섯째 자리에서 반올림</div>
        </div>
        <div class="formula">
          <div class="formula-head">
            <span class="formula-label">산식</span>
            <button class="btn-ghost" id="btn-copy" type="button">산식 복사</button>
          </div>
          <textarea class="formula-text" id="resultText" readonly></textarea>
        </div>
      </div>

      <div class="empty" id="empty">유형·지역과 거래·기준시점을 입력한 뒤 [시점수정치 계산]을 누르면 결과가 표시됩니다.</div>
    </div>

  <div class="datarow">
    <span class="datarow-label">데이터 기준</span>
    <span class="datarow-meta" id="meta"></span>
  </div>
  <div class="datarow" style="margin-top:6px;">
    <span class="datarow-label">접속 기록</span>
    <span class="datarow-meta">사내 관리 목적으로 접속·계산 시각, 사용자 이름, 기기·브라우저, IP 주소와 접속 지역이 관리자에게 기록됩니다.</span>
  </div>
</main>

<script src="arap_index_data.js"></script>
<script>
// ── 아래 계산 로직은 집합건물.html의 buildSjIdxText / buildNrCapText와 동일 규칙 (수정 시 양쪽 함께)
const idxData=()=>window.ARAP_INDEX_DATA||null;
const capData=()=>(window.ARAP_INDEX_DATA&&window.ARAP_INDEX_DATA.capReturn)||null;
const normDate=v=>{const s=String(v||"").replace(/[^0-9]/g,"");if(s.length>=8)return s.slice(0,4)+"."+s.slice(4,6)+"."+s.slice(6,8);if(s.length>=6)return s.slice(0,4)+"."+s.slice(4,6);return"";};
const idxYm=d=>{const m=normDate(d).match(/^(\d{4})\.(\d{2})/);return m?m[1]+m[2]:null;};
const idxYmDisp=ym=>ym?`${ym.slice(0,4)}.${ym.slice(4,6)}`:"";
const idxKindList=()=>{const D=idxData();if(!D)return[];return["아파트","연립다세대","오피스텔"].filter(k=>D.tables[k]);};
// 유형별 지역 목록: 시도(서울→경기→인천→수도권) 순 → 시도 전체가 맨 앞 → 하위지역 가나다순
const ROOT_ORDER=["서울","경기","인천","수도권"];
const idxRegionList=kind=>{const D=idxData();if(!D||!D.tables[kind])return[];const rs=D.tables[kind].regions;
  return Object.keys(rs).sort((a,b)=>{
    const pa=rs[a].full.split(">"),pb=rs[b].full.split(">");
    const ra=ROOT_ORDER.indexOf(pa[0]),rb=ROOT_ORDER.indexOf(pb[0]);
    if(ra!==rb)return(ra<0?99:ra)-(rb<0?99:rb);
    if(pa.length!==pb.length&&(pa.length===1||pb.length===1))return pa.length-pb.length; // 시도 전체 먼저
    return a.localeCompare(b,"ko");
  });};
const buildSjIdxText=(kind,regionKey,tradeDate,baseDate)=>{
  const D=idxData();if(!D)return{err:"지수 데이터(arap_index_data.js)가 없습니다."};
  const tbl=D.tables[kind];if(!tbl)return{err:"지수 표가 없습니다: "+kind};
  let rk=regionKey;const note=[];
  if(!tbl.regions[rk]){
    // 연립다세대는 권역 단위까지만 공표 → 구 선택 시 소속 권역 지수로 대체
    const aptReg=D.tables["아파트"].regions[regionKey];
    const gwon=aptReg?aptReg.full.split(">")[2]:null;
    if(gwon&&tbl.regions[gwon]){rk=gwon;note.push(`※ ${kind} 지수는 권역 단위로 공표되어 ${gwon} 지수를 적용함`);}
    else return{err:`${kind} 지수에 '${regionKey}' 지역이 없습니다.`};
  }
  const reg=tbl.regions[rk];
  const tYm=idxYm(tradeDate);if(!tYm)return{err:"거래시점을 입력하세요. (예: 2025.10.18)"};
  // 날짜는 한글 표기 — "2025.10" 패턴이 산식에 섞이면 앱의 parseTimeAdjDetail이 지수월로 오인함
  const korYm=ym=>`${+ym.slice(0,4)}년 ${+ym.slice(4,6)}월`;
  const korDate=d=>{const p=normDate(d).split(".");if(p.length>=3)return`${+p[0]}년 ${+p[1]}월 ${+p[2]}일`;const ym=idxYm(d);return ym?korYm(ym):normDate(d);};
  const prevYm=ym=>{const y=+ym.slice(0,4),m=+ym.slice(4,6);return m===1?`${y-1}12`:`${y}${String(m-1).padStart(2,"0")}`;};
  // 거래월 지수는 그 달이 끝나기 전 미완성 → 거래시점의 전월 지수를 적용 (평가 관행)
  let tUse=prevYm(tYm);
  note.push(`※ 거래시점(${korDate(tradeDate)})의 전월인 ${korYm(tUse)} 지수를 적용함`);
  if(tUse>tbl.latest){tUse=tbl.latest;note.push(`※ 해당 월 지수 미공표 → 최근 공표분(${korYm(tbl.latest)}) 지수를 적용함`);}
  const bRaw=idxYm(baseDate);
  let bYm=bRaw?prevYm(bRaw):tbl.latest;
  if(bRaw)note.push(`※ 기준시점(${korDate(baseDate)})의 전월인 ${korYm(bYm)} 지수를 적용함`);
  if(bYm>tbl.latest){bYm=tbl.latest;note.push(`※ 해당 월 지수 미공표 → 최근 공표분(${korYm(tbl.latest)}) 지수를 적용함`);}
  const tv=reg.s[tUse],bv=reg.s[bYm];
  const firstYm=Object.keys(reg.s)[0];
  if(tv==null)return{err:`${rk} ${idxYmDisp(tUse)} 지수가 없습니다 (이 지역 지수는 ${idxYmDisp(firstYm)}부터 공표).`};
  if(bv==null)return{err:`${rk} ${idxYmDisp(bYm)} 지수가 없습니다.`};
  const adj=Math.round(bv/tv*1e5)/1e5; // 여섯째 자리 반올림 → 다섯째 자리 표시 (부동산원 KAS 조회화면과 동일)
  const regionDisp=(()=>{const p=reg.full.split(">").map(s=>s.trim());return p[0]===p[p.length-1]?p[0]:p[0]+" "+p[p.length-1];})(); // 시도+말단 표기 (경기·인천 대응)
  const lines=[kind,`지역 : ${regionDisp}`];
  lines.push(`매매가격지수(한국부동산원) : ${idxYmDisp(tUse)} ~ ${idxYmDisp(bYm)}`);
  note.forEach(n=>lines.push(n));
  lines.push(`시점수정치 : ${bv.toFixed(1)}/${tv.toFixed(1)}≒${adj.toFixed(5)}`);
  return{text:lines.join("\n"),adj};
};
const capTypeList=()=>{const D=capData();return D?Object.keys(D.types):[];};
// 비주거용 지역은 서울·경기·인천만 노출 (전국 상권 단위는 시점수정에 안 씀)
const capRegionList=kind=>{const D=capData();if(!D||!D.types[kind])return[];
  const rs=D.types[kind].regions;return["서울","경기","인천"].filter(k=>rs[k]);};
const buildNrCapText=(kind,region,tradeDate,baseDate)=>{
  const D=capData();if(!D)return{err:"자본수익률 데이터가 없습니다."};
  const T=D.types[kind];if(!T)return{err:"자본수익률 유형이 없습니다: "+kind};
  const ser=T.regions[region];if(!ser)return{err:`'${kind}' 자료에 '${region}' 지역이 없습니다.`};
  const pd=s=>{const m=String(s||"").replace(/[^0-9]/g,"");if(m.length<8)return null;return new Date(+m.slice(0,4),+m.slice(4,6)-1,+m.slice(6,8));};
  const t0=pd(tradeDate),t1=pd(baseDate);
  if(!t0)return{err:"거래시점 날짜를 입력하세요. (예: 2024.05.06)"};
  if(!t1)return{err:"기준시점 날짜를 입력하세요."};
  const DAY=86400000;
  const qOf=dt=>({y:dt.getFullYear(),q:Math.floor(dt.getMonth()/3)+1});
  const qStart=(y,q)=>new Date(y,(q-1)*3,1),qEnd=(y,q)=>new Date(y,q*3,0);
  const diQ=(y,q)=>Math.round((qEnd(y,q)-qStart(y,q))/DAY)+1;
  const doQ=(dt,y,q)=>Math.round((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())-qStart(y,q))/DAY)+1;
  const qCmp=(a,b)=>(a.y*4+a.q)-(b.y*4+b.q),nextQ=(y,q)=>q>=4?{y:y+1,q:1}:{y,q:q+1};
  const qa=qOf(t0),qb=qOf(t1);
  if(qCmp(qa,qb)>0)return{err:"거래시점이 기준시점보다 뒤입니다. 날짜를 확인하세요."};
  const lm=String(T.latest||"").match(/^(\d{4})(\d)$/);if(!lm)return{err:"자본수익률 최신 분기 정보가 없습니다."};
  const latest={y:+lm[1],q:+lm[2]};
  const rateOf=(y,q)=>{let yy=y,qq=q;if(qCmp({y,q},latest)>0){yy=latest.y;qq=latest.q;}const v=ser[`${yy}${qq}`];return v==null?null:v/100;};
  const facs=[],qlist=[];
  let cur={y:qa.y,q:qa.q};
  while(qCmp(cur,qb)<=0){
    const first=qCmp(cur,qa)===0,last=qCmp(cur,qb)===0,di=diQ(cur.y,cur.q);
    const isMg=qCmp(cur,latest)>0;
    const r=rateOf(cur.y,cur.q);if(r==null)return{err:`${cur.y}년 ${cur.q}분기 자본수익률 자료가 없습니다. (이 지역 최근 공표: ${latest.y}.${latest.q}분기)`};
    const rStr=(Math.round(r*1e6)/1e6).toString();
    // 미공표 분기 일할 분모 = 최근 공표분기 총일수
    const dayDenominator=isMg?diQ(latest.y,latest.q):di;
    let day=0;
    if(first&&last)day=doQ(t1,cur.y,cur.q)-doQ(t0,cur.y,cur.q)+1;
    else if(first)day=di-doQ(t0,cur.y,cur.q)+1;
    else if(last)day=doQ(t1,cur.y,cur.q);
    facs.push((first||last)?{str:`(1+${rStr}*${day}/${dayDenominator})`,val:1+r*day/dayDenominator}:{str:`(1+${rStr})`,val:1+r});
    const pct=Math.round(r*1e6)/1e4;
    qlist.push(`${cur.y}년 ${cur.q}분기 : ${pct}%`+(isMg?` (${latest.y}년 ${latest.q}분기 자료)`:""));

  }
  const product=facs.reduce((a,f)=>a*f.val,1);
  const adj=Math.round(product*1e5)/1e5;
  const formula=facs.map(f=>f.str).join("*")+` ≒ ${adj.toFixed(5)}`;
  const text=[kind,`지역 : ${region}`,`(${qa.y}.${qa.q} ~ ${qb.y}.${qb.q})`,...qlist,formula].join("\n");
  return{text,adj};
};

const jbVal=(r,f)=>String(r[f[2]]||r[f[1]]||"").trim();
const jbFull=(r,f)=>String(r[f[1]]||r[f[2]]||"").trim();
function jbDetect(rows){
  let best=null,bestN=-1;
  JB_FIELDS.forEach(f=>{const n=rows.filter(r=>JB_USE_RE.test(jbVal(r,f))).length;if(n>bestN){bestN=n;best=f;}});
  jbState.useF=bestN>0?best:JB_FIELDS[2];
  let regF=null,regN=-1;
  JB_FIELDS.forEach(f=>{if(f[0]===jbState.useF[0])return;const set={};let n=0;
    rows.forEach(r=>{const v=jbFull(r,f);if(v&&!set[v]){set[v]=1;n++;}});if(n>regN){regN=n;regF=f;}});

}
function jbSplit(r){
  const uf=jbState.useF,rf=jbState.regF;let use=jbVal(r,uf);

}
const jbRegLabel=reg=>String(reg||"").split(">").map(p=>p.trim()).filter(Boolean).join(" ");
// 월별 변동률(%) → 시점수정치. 첫·끝 달 일수비례, 미공표 월은 마지막 공표월 변동률. 산식 줄도 함께 만든다.
function jbFactor(rates,g,e){
  const ymS=g.y*100+g.mo,ymE=e.y*100+e.mo;let factor=1,lastRate=null,lastYm=null;const facs=[],mlist=[];
  // 거래월 이전의 마지막 공표월 값이 있으면 그것부터 이어받는다 (거래월 자체가 미공표일 때)
  Object.keys(rates).map(Number).filter(k=>k<ymS).sort((x,y)=>x-y).forEach(k=>{lastRate=rates[k];lastYm=k;});
  for(let ym=ymS;ym<=ymE;ym=ymAdd(ym,1)){
    const y=Math.floor(ym/100),mo=ym%100,D=daysIn(y,mo);
    const published=(ym in rates),r=published?rates[ym]:lastRate;
    if(r==null)throw new Error(`${y}.${String(mo).padStart(2,"0")}월 변동률이 없습니다.`);
    if(published){lastRate=r;lastYm=ym;}
    const d1=(ym===ymS)?g.d:1,d2=(ym===ymE)?e.d:D,days=d2-d1+1,frac=days/D;
    const rr=(Math.round(r/100*1e6)/1e6).toString();
    if(frac>=1){factor*=1+r/100;facs.push(`(1+${rr})`);}
    else{factor*=1+(r/100)*frac;facs.push(`(1+${rr}*${days}/${D})`);}
    mlist.push(`${y}년 ${mo}월 : ${r}%`+(frac<1?` (${days}일/${D}일)`:"")+(published?"":` (미공표 → ${Math.floor(lastYm/100)}년 ${lastYm%100}월 변동률 적용)`));

async function jbMonthRates(ym){

let jbPrepPromise=null;
function jbPrepare(status){

    const d=new Date(),endYm=d.getFullYear()*100+d.getMonth()+1;

    if(!regs.length||!uses.length)throw new Error("표 구조를 해석하지 못했습니다.");
    // 정렬: 전국 → 서울 → 경기 → 인천 → 나머지 시도 가나다. 시도 안에서는 '시도 전체'가 맨 앞, 그 아래 시군구는 가나다순 (강남구가 서울 바로 다음)

  })();

async function buildLandText(use,reg,tradeDate,baseDate,status){

  if(!e)return{err:"기준시점 날짜를 입력하세요."};
  if(new Date(g.y,g.mo-1,g.d)>new Date(e.y,e.mo-1,e.d))return{err:"거래시점이 기준시점보다 뒤입니다. 날짜를 확인하세요."};
  if(!reg||!use)return{err:"지역과 용도지역을 선택하세요."};
  await jbPrepare(status);

  const R=jbLoadRates();
  yms.forEach(ym=>{const v=R[ym+"|"+reg+"|"+use];if(v!=null)rates[ym]=v;});
  if(ymS>jbState.latestYm&&rates[jbState.latestYm]==null)return{err:`${ymDisp(jbState.latestYm)}월 변동률이 없습니다.`};
  let f;try{f=jbFactor(rates,g,e);}catch(err){return{err:err.message};}
  const adj=Math.round(f.factor*1e5)/1e5;
  const kd=d=>`${d.y}년 ${d.mo}월 ${d.d}일`;
  const lines=["토지",`지역 : ${jbRegLabel(reg)}`,`용도지역 : ${use}`,
    `지가변동률(한국부동산원) : ${kd(g)} ~ ${kd(e)}`,...f.mlist,
    f.facs.join("*")+` ≒ ${adj.toFixed(5)}`];
  if(ymE>jbState.latestYm)lines.push(`※ ${ymDisp(jbState.latestYm)}월 공표분까지 반영, 이후는 마지막 공표월 변동률로 일할 추정함`);
  return{text:lines.join("\n"),adj};
}

function fillLandSelectors(){
  if(jbState.regs.length){
    fillSelect($("kind"),jbState.uses,lsGet(LS_KIND.land)||"주거지역");
    const saved=lsGet(LS_REG.land);$("region").innerHTML="";
    jbState.regs.forEach(r=>{const el=document.createElement("option");el.value=r;el.textContent=jbRegLabel(r);$("region").appendChild(el);});
    if(saved&&jbState.regs.includes(saved))$("region").value=saved;
    setStatus("");return;
  }
  fillSelect($("kind"),["불러오는 중…"]);fillSelect($("region"),["불러오는 중…"]);
  jbPrepare(setStatus).then(()=>{if(mode==="land")fillLandSelectors();updateMeta();})
    .catch(e=>{console.error("지가변동률 준비",e);setStatus("");$("err").textContent="지가변동률 목록을 못 받았습니다: "+e.message;$("err").style.display="block";});
}
function updateMeta(){
  const D=idxData(),C=capData();
  const sn=$("segNote");if(sn)sn.textContent=mode==="res"?"산정 기준 · 매매가격지수 (한국부동산원)":mode==="nr"?"산정 기준 · 자본수익률 (상업용부동산 임대동향조사)":"산정 기준 · 지가변동률 (한국부동산원, 용도지역별 월간)";
  if(mode==="land"){$("meta").textContent=jbState.latestYm?`한국부동산원 지가변동률(용도지역별) · ${ymDisp(jbState.latestYm)} 공표분까지 (접속 시 조회) · 첫/끝 달 일수비례, 미공표 월은 마지막 공표월 변동률로 일할 추정`:"한국부동산원 지가변동률 · 목록 불러오는 중…";}
  else if(mode==="res"){const tbl=D&&D.tables[$("kind").value];
    $("meta").textContent=tbl?`한국부동산원 매매가격지수 · ${idxYmDisp(tbl.latest)} 공표분까지 (${D.fetchedAt} 수신) · 거래·기준시점 모두 전월 지수 적용`:"지수 데이터 없음 — main에 arap_index_data.js가 매일 자동 갱신됩니다";}
  else{const l=C&&C.types[$("kind").value]?C.types[$("kind").value].latest:"";const m=String(l||"").match(/^(\d{4})(\d)$/);
    $("meta").textContent=C?`상업용부동산 임대동향조사 자본수익률 · ${m?`${m[1]}.${m[2]}분기`:"-"} 공표분까지 (${C.fetchedAt||idxData().fetchedAt} 수신) · 첫/끝 분기 일수비례, 중간분기 복리`:"자본수익률 데이터 없음";}
}
// 탭 2단: 집합건물(주거용 | 비주거용) / 토지.  mode는 그대로 res·nr·land 세 값
let lastBld="res";
const setMode=m=>{mode=m;if(m!=="land")lastBld=m;
  $("tab-bld").classList.toggle("on",m!=="land");$("tab-land").classList.toggle("on",m==="land");
  $("sub-bld").classList.toggle("off",m==="land");
  $("tab-res").classList.toggle("on",m==="res");$("tab-nr").classList.toggle("on",m==="nr");
  $("err").style.display="none";refreshSelectors();};
$("tab-bld").onclick=()=>setMode(lastBld);$("tab-land").onclick=()=>setMode("land");
$("tab-res").onclick=()=>setMode("res");$("tab-nr").onclick=()=>setMode("nr");
$("kind").onchange=()=>{lsSet(LS_KIND[mode],$("kind").value);
  if(mode==="land")return;   // 토지는 용도지역이 바뀌어도 지역 목록은 그대로
  fillSelect($("region"),mode==="nr"?capRegionList($("kind").value):idxRegionList($("kind").value),lsGet(LS_REG[mode]));updateMeta();};
$("region").onchange=()=>lsSet(LS_REG[mode],$("region").value);
let calcBusy=false;
$("btn-calc").onclick=async()=>{
  if(calcBusy)return;
  let r;
  if(mode==="land"){
    if(!jbState.regs.length){$("err").textContent="지가변동률 목록을 아직 못 받았습니다. 잠시 뒤 다시 눌러주세요.";$("err").style.display="block";return;}
    calcBusy=true;$("btn-calc").disabled=true;$("err").style.display="none";
    try{r=await buildLandText($("kind").value,$("region").value,$("tradeDate").value,$("baseDate").value,setStatus);}
    catch(e){console.error("지가변동률 계산",e);r={err:"지가변동률 조회 실패: "+e.message};}
    finally{calcBusy=false;$("btn-calc").disabled=false;setStatus("");}
  }else r=(mode==="res"?buildSjIdxText:buildNrCapText)($("kind").value,$("region").value,$("tradeDate").value,$("baseDate").value);
  if(r.err){$("err").textContent=r.err;$("err").style.display="block";$("out").style.display="none";$("empty").style.display="block";return;}
  $("err").style.display="none";$("out").style.display="block";$("empty").style.display="none";
  $("adjNum").textContent=r.adj.toFixed(5);$("resultText").value=r.text;
  try{window.arapVisitLog&&window.arapVisitLog("계산",`${MODE_LABEL[mode]} ${$("kind").value} ${mode==="land"?jbRegLabel($("region").value):$("region").value} · ${$("tradeDate").value}→${$("baseDate").value} = ${r.adj.toFixed(5)}`);}catch(e){console.error('visit log',e);}
};
$("btn-copy").onclick=async()=>{
  const t=$("resultText").value;
  try{await navigator.clipboard.writeText(t);}
  catch(e){console.error('clipboard',e);$("resultText").select();document.execCommand("copy");}
  $("btn-copy").textContent="복사됨";setTimeout(()=>{$("btn-copy").textContent="산식 복사";},1500);
};
// 기준시점 기본값 = 오늘
(()=>{const d=new Date();$("baseDate").value=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;})();
refreshSelectors();
// 토지 탭을 누르기 전에 미리 준비 (저장된 게 있으면 즉시, 없으면 뒤에서 조용히 받아 둠)
jbPrepare(()=>{}).then(()=>{if(mode==="land")fillLandSelectors();}).catch(e=>console.error("지가변동률 미리준비",e));

// ── 접속 기록 (관리자용) — 페이지 접속·계산 때 누가(이름)·무엇으로(기기·브라우저)·어디서(IP·지역) 썼는지 관리자 수신함 '접속' 탭에 보낸다 ──
// IP·지역은 앱스 스크립트가 알 수 없어 브라우저가 IP 조회 서비스(ipwho.is → 실패 시 ipapi.co)에서 받아 함께 보낸다. 실패해도 기기·시각은 기록.
// 이름은 첫 화면(arap_name.js)에서 적은 이름 — 집합건물·입주권 앱에서 고른 이름과 같은 저장값. 실패해도 페이지 동작에는 영향 없음.
window.ARAP_USAGE_URL="https://script.google.com/macros/s/AKfycbxx2D6-vWHBS7UPUrhdd4Fz5iayqUlgM4IZcqlNCAuERxY3Wpijdo3xw29Xz3_gs_7Leg/exec";
(function(){
  const ua=navigator.userAgent||"";
  const touchMac=/Macintosh/.test(ua)&&navigator.maxTouchPoints>1;          // iPadOS는 데스크톱 UA로 위장
  const mobile=(navigator.userAgentData&&navigator.userAgentData.mobile)||/Mobi|Android|iPhone|iPod/i.test(ua);
  const device=(/iPad|Tablet/i.test(ua)||touchMac)?"태블릿":mobile?"휴대폰":"PC";
  const os=/Windows/i.test(ua)?"Windows":/iPhone|iPad|iPod/i.test(ua)||touchMac?"iOS":/Android/i.test(ua)?"Android":/Mac OS/i.test(ua)?"macOS":"";
  const browser=/Whale/i.test(ua)?"웨일":/SamsungBrowser/i.test(ua)?"삼성브라우저":/Edg\//i.test(ua)?"엣지":/KAKAOTALK/i.test(ua)?"카카오톡":/NAVER\(/i.test(ua)?"네이버앱":/Chrome\//i.test(ua)?"크롬":/Safari\//i.test(ua)?"사파리":/Firefox/i.test(ua)?"파이어폭스":"기타";
  const KO={"South Korea":"대한민국","Korea":"대한민국","Seoul":"서울","Busan":"부산","Incheon":"인천","Daegu":"대구","Daejeon":"대전","Gwangju":"광주","Ulsan":"울산","Sejong":"세종","Gyeonggi-do":"경기","Gangwon-do":"강원","Chungcheongbuk-do":"충북","Chungcheongnam-do":"충남","Jeollabuk-do":"전북","Jeollanam-do":"전남","Gyeongsangbuk-do":"경북","Gyeongsangnam-do":"경남","Jeju-do":"제주"};
  const ko=s=>KO[s]||s||"";
  let geoP=null;
  const fetchJson=async(url)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});return await r.json();}finally{clearTimeout(t);}};
  const geo=()=>geoP||(geoP=(async()=>{
    try{const j=await fetchJson("https://ipwho.is/");if(j&&j.success!==false&&j.ip)return {ip:j.ip,region:[ko(j.country),ko(j.region),ko(j.city)].filter((v,i,a)=>v&&a.indexOf(v)===i).join(" "),isp:(j.connection&&(j.connection.isp||j.connection.org))||""};}catch(e){console.error('geo1',e);}
    try{const j=await fetchJson("https://ipapi.co/json/");if(j&&!j.error&&j.ip)return {ip:j.ip,region:[ko(j.country_name),ko(j.region),ko(j.city)].filter((v,i,a)=>v&&a.indexOf(v)===i).join(" "),isp:j.org||""};}catch(e){console.error('geo2',e);}
    return {ip:"",region:"확인 실패",isp:""};
  })());
  window.arapVisitLog=async function(action,detail){
    try{
      const g=await geo();
      const user=lsGet("arap-user-name")||"";
      const p={visit:"1",page:"시점수정",user:user||"(이름 미등록)",action:action||"",device:device+(os?" · "+os:""),browser:browser,ip:g.ip,region:g.region,isp:g.isp,detail:detail||""};
      await fetch(window.ARAP_USAGE_URL+"?"+new URLSearchParams(p).toString(),{cache:"no-store"});
    }catch(e){console.error('visit log',e);}
  };
  // 이름을 적은 뒤에 '접속'을 보낸다 (이미 저장돼 있으면 즉시) — 이름 없는 접속 기록이 남지 않게
  if(window.arapNameReady)window.arapNameReady(function(){window.arapVisitLog("접속","");});
  else window.arapVisitLog("접속","");
})();
</script>
</body>
